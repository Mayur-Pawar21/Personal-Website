<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games | Your Name</title> <!-- EDIT -->
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style.css">
  <script>
    (function () {
      var r = document.documentElement, t = null, a = null;
      try { t = localStorage.getItem('theme'); a = localStorage.getItem('accent'); } catch (e) {}
      r.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      r.dataset.accent = a || 'moss';
    })();
  </script>
</head>

<body data-page="games">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <section class="wrap page-head">
      <h1>Games</h1>
      <!-- EDIT -->
      <p class="lede">Every bar is roughly how long I've spent inside that game.</p>
    </section>

    <section class="wrap" style="padding-top: 1rem;">
      <div class="toolbar">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="hours">Most played</option>
          <option value="title">Name (A to Z)</option>
          <option value="status">Status</option>
        </select>
      </div>
      <!-- Rows are drawn from GAMES in Data.js. Cover image links go there (the "cover" field). -->
      <ul class="games" id="game-list"></ul>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="Data.js"></script>
  <script src="Index.js"></script>
</body>
</html>
