<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shows | Your Name</title> <!-- EDIT -->
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Style.css">
  <script>
    (function () {
      var r = document.documentElement, t = null, a = null;
      try { t = localStorage.getItem('theme'); a = localStorage.getItem('accent'); } catch (e) {}
      r.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      r.dataset.accent = a || 'moss';
    })();
  </script>
</head>

<body data-page="shows">
  <a class="skip" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <section class="wrap page-head">
      <h1>Shows</h1>
      <!-- EDIT -->
      <p class="lede">My watchlist, with honest star ratings.</p>
    </section>

    <section class="wrap" style="padding-top: 1rem;">
      <div class="chips" id="filters" role="group" aria-label="Filter shows by status"></div>
      <!-- Posters are drawn from SHOWS in Data.js. Poster image links go there (the "cover" field). -->
      <div class="poster-grid" id="poster-grid"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="Data.js"></script>
  <script src="Index.js"></script>
</body>
</html>
